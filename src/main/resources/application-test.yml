spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

server:
  port: 8080

app:
  jwt:
    secret: test-secret-key-32-chars-minimum-here
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:8080

logging:
  level:
    root: INFO
    com.healthyconsciousness: DEBUG
