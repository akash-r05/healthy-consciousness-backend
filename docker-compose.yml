services:
  mysql:
    image: mysql:8.0
    container_name: healthy-consciousness-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-healthy_consciousness}
      MYSQL_USER: ${DB_USERNAME:-healthy_consciousness}
      MYSQL_PASSWORD: ${DB_PASSWORD:-healthy_consciousness}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
